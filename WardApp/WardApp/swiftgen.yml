 xcassets:
   inputs:
     - Resources/Assets.xcassets
     - Resources/Color.xcassets
     - Resources/Image.xcassets
   outputs:
     - templateName: swift5
       params:
         publicAccess: true
         forceProvidesNamespaces: true
         enumName: WardAssets
       output: Resources/XCAssets+Generated.swift
       
 fonts:
   inputs:
     - Resources/Fonts
   outputs:
     - templateName: swift5
       params:
         publicAccess: true
         forceProvidesNamespaces: true
         enumName: WardFonts
       output: Resources/Fonts+Generated.swift
       
 strings:
   inputs:
     - Resources/ko.lproj
   filter: .+\.strings$
   outputs:
     - templateName: structured-swift5
       params:
         publicAccess: true
         forceProvidesNamespaces: true
         enumName: WardStrings
       output: Resources/Strings+Generated.swift
