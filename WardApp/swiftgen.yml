 xcassets:
   inputs:
     - WardApp/Resources/Color.xcassets
     - WardApp/Resources/Image.xcassets
   outputs:
     - templateName: swift5
       params:
         platform: ios
         publicAccess: true
         forceProvidesNamespaces: true
         enumName: WardAssets
       output: WardApp/Resources/XCAssets+Generated.swift
       
 fonts:
   inputs:
     - WardApp/Resources/Fonts
   outputs:
     - templateName: swift5
       params:
         platform: ios
         publicAccess: true
         forceProvidesNamespaces: true
         enumName: WardFonts
       output: WardApp/Resources/Fonts+Generated.swift
       
 strings:
   inputs:
     - WardApp/Resources/ko.lproj
   filter: .+\.strings$
   outputs:
     - templateName: structured-swift5
       params:
         platform: ios
         publicAccess: true
         forceProvidesNamespaces: true
         enumName: WardStrings
       output: WardApp/Resources/Strings+Generated.swift
